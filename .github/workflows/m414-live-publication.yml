# Exact merged website and compiler pins from independently verified publication.
name: Verify issue 414 deployed documentation
on:
  push:
    branches: ['codex/414-live-publication-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_WEBSITE_COMMIT: '6972d73cd54dd440e8142eea83344584cdc621d6'
      EXPECTED_WEBSITE_TREE: '188485b263db33690ada9396f3ff6391016bc45b'
      EXPECTED_COMPILER_COMMIT: '01c81f4087982b2f1c99c85f9a7c0360dbeb0e28'
      EXPECTED_MANIFEST_SHA256: 'f1c4e2a1baaef84ecfe472a7d9b830ad49d5b1eb535e99fca6143a0e636abf30'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: '6972d73cd54dd440e8142eea83344584cdc621d6'
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.20.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.24.0
      - name: Verify the actual website checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_WEBSITE_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_WEBSITE_TREE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir -m 700 "$RUNNER_TEMP/m414-live-publication"
          git show --no-patch --format=fuller HEAD > "$RUNNER_TEMP/m414-live-publication/website-source.txt"
      - run: pnpm install --frozen-lockfile
      - name: Execute the unchanged deployed-content checker once
        shell: bash
        run: |
          set -euo pipefail
          node tools/docs/check-published-content.mjs --origin https://zryna.com > "$RUNNER_TEMP/m414-live-publication/result.json"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const result=JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/m414-live-publication/result.json'));
          for(const key of ['EXPECTED_WEBSITE_COMMIT','EXPECTED_WEBSITE_TREE','EXPECTED_COMPILER_COMMIT']) assert.match(process.env[key],/^[a-f0-9]{40}$/u);
          assert.match(process.env.EXPECTED_MANIFEST_SHA256,/^[a-f0-9]{64}$/u);
          assert.equal(result.result,'passed');
          assert.equal(result.mode,'--origin');
          assert.equal(result.origin,'https://zryna.com');
          assert.equal(result.checkerWebsiteCommit,process.env.EXPECTED_WEBSITE_COMMIT);
          assert.equal(result.checkerWebsiteTree,process.env.EXPECTED_WEBSITE_TREE);
          assert.equal(result.sourceCommit,process.env.EXPECTED_COMPILER_COMMIT);
          assert.equal(result.manifestSha256,process.env.EXPECTED_MANIFEST_SHA256);
          assert.equal(result.observedDeployment,null);
          assert.equal(result.responses.length,result.routes);
          assert(result.responses.length>0&&result.responses.every(response=>response.status===200));
          JS
      - name: Preserve the original checker result and source identity
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: m414-live-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m414-live-publication/*
          if-no-files-found: error
          retention-days: 30
